# Exemple de compose pour un membre du cercle. À adapter : user, NODE_NAME,
# WG_PUBLIC_ENDPOINTS, UI_PASSWORD et les trois dossiers.
services:
  cercle:
    image: ghcr.io/db-cl/cercle:1
    container_name: cercle
    user: "1026:100"            # utilisateur du NAS propriétaire des dossiers (commande id sur le NAS)
    read_only: true
    tmpfs:
      - /tmp
    ports:
      - "51820:51820/udp"       # à rediriger sur la box, en UDP
      - "8080:8080"             # interface web, à garder sur le réseau local
    environment:
      NODE_NAME: alice
      WG_PUBLIC_ENDPOINTS: "alice.duckdns.org:51820"
      UI_PASSWORD: "change-moi"
      UPLOAD_LIMIT: 20M
      MAX_UPLOADS: 3
      TZ: Europe/Paris
    volumes:
      - /volume1/partage:/share:ro
      - /volume1/recu:/downloads
      - /volume1/docker/cercle:/data
    restart: unless-stopped
