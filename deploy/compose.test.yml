# End-to-end test: 5 nodes on a Docker bridge network. Run by deploy/e2e.sh.
x-node: &node
  image: ${CERCLE_IMAGE:-cercle:e2e}
  user: "${CERCLE_UID:-65532}:${CERCLE_GID:-65532}"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs:
    - /tmp
  environment: &env
    UI_PASSWORD: e2e
    LOG_LEVEL: info
    TZ: Europe/Paris

services:
  node1:
    <<: *node
    environment: { <<: *env, NODE_NAME: node1, WG_PUBLIC_ENDPOINTS: "node1:51820" }
    ports: ["127.0.0.1:18181:8080"]
    volumes: ["./e2e-data/node1/share:/share:ro", "./e2e-data/node1/data:/data", "./e2e-data/node1/downloads:/downloads"]
  node2:
    <<: *node
    environment: { <<: *env, NODE_NAME: node2, WG_PUBLIC_ENDPOINTS: "node2:51820" }
    ports: ["127.0.0.1:18182:8080"]
    volumes: ["./e2e-data/node2/share:/share:ro", "./e2e-data/node2/data:/data", "./e2e-data/node2/downloads:/downloads"]
  node3:
