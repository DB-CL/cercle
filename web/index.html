<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cercle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%232f6fde' stroke-width='5'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/membres"><span class="logo" aria-hidden="true"></span>Cercle</a>
      <nav id="nav" class="tabs" hidden>
        <a href="#/membres" data-view="membres">Membres</a>
        <a href="#/telechargements" data-view="telechargements">Téléchargements <span id="nav-count" class="count" hidden></span></a>
        <a href="#/reglages" data-view="reglages">Réglages</a>
      </nav>
      <span id="whoami" class="whoami"></span>
      <button id="logout" class="link logout" type="button" hidden>Se déconnecter</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app" class="wrap" aria-live="polite">
    <p class="muted">Chargement…</p>
  </main>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
