<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Cercle</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%232f6fde' stroke-width='5'/%3E%3C/svg%3E">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/members"><span class="logo" aria-hidden="true"></span>Cercle</a>
      <nav id="nav" class="tabs" hidden>
        <a href="#/members" data-view="members"><span class="key">1</span>members</a>
        <a href="#/downloads" data-view="downloads"><span class="key">2</span>downloads <span id="nav-count" class="count" hidden></span></a>
        <a href="#/settings" data-view="settings"><span class="key">3</span>settings</a>
      </nav>
      <span id="whoami" class="whoami"></span>
      <button id="logout" class="logout" type="button" hidden>logout</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>
  <main id="app" class="wrap" aria-live="polite">
    <p class="muted">Loading…</p>
  </main>
  <footer id="statusbar" class="statusbar" hidden>
    <span class="on">online<b id="sb-online">0/0</b></span>
    <span>queue<b id="sb-queue">0</b></span>
    <span class="rate">↓<b id="sb-rate">0 B/s</b></span>
    <span class="keys">1 2 3: views · ?: help</span>
    <span id="sb-version"></span>
  </footer>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
